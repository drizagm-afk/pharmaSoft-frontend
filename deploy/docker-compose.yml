name: pharmasoft-s13

services:
  redis:
    image: redis:7-alpine
    container_name: pharma-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  web:
    image: nginx:1.27-alpine
    container_name: pharma-web
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - type: bind
        source: ../dist/pharma-frontend/browser
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "backend:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
