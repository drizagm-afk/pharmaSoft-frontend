@if (auth.porVencer() && !auth.avisoOculto()) {
  <aside class="aviso-sesion" role="status">
    <span
      ><span aria-hidden="true">⚠</span> Su sesión vence en <strong>{{ tiempo() }}</strong
      >.</span
    >
    <div class="acciones-aviso">
      <button type="button" (click)="auth.cerrarSesion()">Cerrar sesión ahora</button>
      <button
        type="button"
        class="ocultar"
        aria-label="Ocultar aviso de sesión"
        (click)="auth.ocultarAviso()"
      >
        ×
      </button>
    </div>
  </aside>
}
